<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII pattern generator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='8,1 24,1 32,16 24,31 8,31 0,16' fill='%23b9adff'/%3E%3Cpath transform='translate(9 9) scale(.875)' fill='%2312130f' d='M5 0C6.1 0 7 .9 7 2v3a1 1 0 0 0 2 0V2c0-1.1.9-2 2-2h3c1.1 0 2 .9 2 2v3c0 1.1-.9 2-2 2h-3a1 1 0 0 0 0 2h3c1.1 0 2 .9 2 2v3c0 1.1-.9 2-2 2h-3c-1.1 0-2-.9-2-2v-3a1 1 0 0 0-2 0v3c0 1.1-.9 2-2 2H2c-1.1 0-2-.9-2-2v-3c0-1.1.9-2 2-2h3a1 1 0 0 0 0-2H2C.9 7 0 6.1 0 5V2C0 .9.9 0 2 0h3Z'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0b09;
    --shell: #131410;
    --card: #181915;
    --raise: #1f201b;
    --field: #22231d;
    --line: #2b2c26;
    --line-soft: #22231e;
    --ink: #ecebe3;
    --muted: #8f9188;
    --faint: #5d5f58;
    --accent: #b9adff;
    --on-accent: #12130f;
    --sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 var(--sans);
    color: var(--ink);
    background: var(--bg);
    padding: 12px;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  svg.i { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Shell: sidebar surface with a raised work card ---------- */
  .shell {
    height: 100%;
    display: grid;
    grid-template-columns: 296px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    border-radius: 28px;
    background:
      radial-gradient(120% 50% at 0% 0%, rgba(185,173,255,.09), transparent 60%),
      radial-gradient(90% 40% at 100% 100%, rgba(120,140,255,.05), transparent 60%),
      var(--shell);
    border: 1px solid var(--line-soft);
    overflow: hidden;
    transition: grid-template-columns .25s ease;
  }
  body.collapsed .shell { grid-template-columns: 0 minmax(0, 1fr); }
  body.collapsed .panel { visibility: hidden; }

  /* ---------- Sidebar ---------- */
  .panel {
    grid-column: 1; grid-row: 1;
    display: flex; flex-direction: column;
    min-height: 0; min-width: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 8px; }
  .logo {
    width: 34px; height: 34px; display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent);
    clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%);
  }
  .logo svg { width: 15px; height: 15px; }
  .brand b { font-size: 14px; font-weight: 600; letter-spacing: -.01em; display: block; }
  .brand span { font-size: 11.5px; color: var(--muted); display: block; margin-top: -1px; }

  .scroll { flex: 1; overflow-y: auto; padding: 8px 20px 20px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .group { margin-top: 18px; }
  .title { display: block; font-size: 12px; color: var(--muted); margin: 0 0 10px; font-weight: 500; }

  .ctl { margin-bottom: 14px; }
  .ctl-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .ctl-head label { font-size: 13px; font-weight: 500; }
  input.val {
    font: 500 11.5px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink);
    width: 56px; text-align: right; padding: 5px 9px;
    border: 1px solid transparent; border-radius: 99px; background: var(--field);
    -moz-appearance: textfield;
  }
  input.val:hover { border-color: var(--line); }
  input.val:focus { outline: none; border-color: var(--accent); }
  input.val::-webkit-outer-spin-button, input.val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px; margin: 6px 0; border-radius: 99px; cursor: pointer;
    background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p, 50%) 100% no-repeat, var(--line);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--ink); border: 4px solid var(--shell); box-shadow: 0 0 0 1px var(--line);
  }
  input[type=range]::-moz-range-thumb {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ink); border: 4px solid var(--shell); box-shadow: 0 0 0 1px var(--line);
  }
  input[type=range]:focus-visible { outline: none; }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--accent); }

  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .glyph-btn {
    aspect-ratio: 1; border: 1px solid var(--line-soft); border-radius: 12px; background: rgba(255,255,255,.02);
    cursor: pointer; padding: 11px; display: grid; place-items: center; position: relative;
    transition: background .15s, border-color .15s;
  }
  .glyph-btn:hover { background: var(--raise); }
  .glyph-btn svg { width: 100%; height: 100%; color: var(--faint); }
  .glyph-btn.on { background: var(--raise); border-color: var(--accent); }
  .glyph-btn.on svg { color: var(--ink); }

  details.custom { margin-top: 10px; }
  details.custom summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; padding: 8px 10px; border-radius: 12px; color: var(--ink);
  }
  details.custom summary::-webkit-details-marker { display: none; }
  details.custom summary:hover { background: rgba(255,255,255,.03); }
  details.custom summary .chev { margin-left: auto; color: var(--muted); transition: transform .15s; }
  details.custom[open] summary .chev { transform: rotate(90deg); }
  textarea {
    width: 100%; min-height: 80px; resize: vertical; margin-top: 6px; font: 11px/1.45 var(--mono);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px;
    background: var(--field); color: var(--ink);
  }
  textarea::placeholder { color: var(--faint); }
  textarea:focus { outline: none; border-color: var(--accent); }

  .colours { display: grid; gap: 4px; }
  .colour {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 12px; cursor: pointer;
  }
  .colour:hover { background: rgba(255,255,255,.03); }
  .colour.off { opacity: .35; pointer-events: none; }
  .colour input[type=color] {
    width: 28px; height: 28px; border: 0; border-radius: 50%; padding: 0; background: none; cursor: pointer; overflow: hidden;
    box-shadow: 0 0 0 1px var(--line);
  }
  .colour input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .colour input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .colour input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; }
  .colour .lbl { font-size: 13px; font-weight: 500; }
  .colour code { margin-left: auto; font: 11.5px var(--mono); color: var(--muted); text-transform: uppercase; }

  .toggle { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .toggle:hover { background: rgba(255,255,255,.03); }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle .sw { width: 30px; height: 18px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: 0 0 auto; }
  .toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
  .toggle input:checked + .sw { background: var(--accent); }
  .toggle input:checked + .sw::after { transform: translateX(12px); background: var(--on-accent); }
  .toggle input:focus-visible + .sw { box-shadow: 0 0 0 2px var(--accent); }

  .hint { font-size: 11.5px; color: var(--muted); margin: 6px 10px 0; line-height: 1.45; }
  .hint code { font-family: var(--mono); font-size: 10.5px; }

  /* Seed card pinned to the bottom, like an account block */
  .seed-card {
    margin: 0 12px 12px; padding: 14px; border-radius: 18px;
    background: rgba(255,255,255,.03); border: 1px solid var(--line-soft);
  }
  .seed-card .ctl { margin-bottom: 10px; }
  .seed-card .ctl-head label { display: flex; align-items: center; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    height: 34px; padding: 0 14px; border-radius: 99px; cursor: pointer; font-size: 12.5px; font-weight: 500;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--raise); }
  .btn:focus-visible, .chip:focus-visible, .icon-btn:focus-visible, .glyph-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.block { width: 100%; }

  /* ---------- Work card ---------- */
  .card {
    grid-column: 2; grid-row: 1;
    margin: 10px 10px 10px 0;
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 20px;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 20px 60px rgba(0,0,0,.35);
    display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
  }
  body.collapsed .card { margin-left: 10px; }

  .crumbs {
    margin: 12px 12px 0; padding: 0 8px 0 10px; height: 52px;
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line-soft); border-radius: 14px;
  }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { background: var(--raise); color: var(--ink); }
  .crumbs .actions { margin-left: auto; display: flex; gap: 6px; }

  .titlebar { display: flex; align-items: center; gap: 18px; padding: 22px 28px 18px; flex-wrap: wrap; }
  .titlebar h2 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .titlebar h2 small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 4px; letter-spacing: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px;
    border-radius: 99px; border: 0; background: var(--raise); color: var(--muted);
    font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s;
  }
  .chip:hover { color: var(--ink); }
  .chip .tick { display: none; width: 15px; height: 15px; }
  .chip.on { background: var(--ink); color: var(--on-accent); padding-left: 10px; }
  .chip.on .tick { display: block; }

  .stage {
    position: relative; flex: 1; min-height: 0;
    border-top: 1px solid var(--line-soft);
    background:
      linear-gradient(var(--line-soft) 1px, transparent 1px) 0 0 / 100% 80px,
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px) 0 0 / 160px 100%;
    background-color: #151612;
  }
  .canvas-wrap {
    position: absolute; inset: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  .canvas-wrap svg {
    display: block; max-width: 100%; max-height: 100%;
    width: auto; height: auto; aspect-ratio: var(--ar, 1);
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 24px 70px rgba(0,0,0,.6);
  }
  .canvas-wrap.transparent svg {
    background: repeating-conic-gradient(#202119 0% 25%, #191a15 0% 50%) 50% / 16px 16px;
  }

  .toast {
    position: fixed; top: 24px; left: 50%; transform: translate(-50%, -6px);
    background: var(--accent); color: var(--on-accent); padding: 8px 16px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Narrow viewports: stack the panel above the card ---------- */
  @media (max-width: 860px) {
    body { height: auto; overflow: auto; padding: 8px; }
    .shell { display: block; height: auto; border-radius: 22px; }
    body.collapsed .panel { display: none; }
    .scroll { overflow: visible; }
    .card { margin: 8px; min-height: 80vh; }
    body.collapsed .card { margin-left: 8px; }
    .crumbs .actions .btn span { display: none; }
    .crumbs .actions .btn { padding: 0 10px; }
    .titlebar { padding: 18px 16px 14px; }
    .canvas-wrap { position: relative; inset: auto; padding: 16px; min-height: 60vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M9.5 4v16"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6.5 15 12l-5.5 5.5"/></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/><path d="m8 12.3 2.7 2.7L16 9.6" stroke="var(--ink)" stroke-width="2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4.5v11M7.5 11l4.5 4.5 4.5-4.5M5 19.5h14"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3.5c4.5 0 4.5 10 9 10H20M4 17h3.5c1.6 0 2.6-1.2 3.4-2.8M13.1 9.8C13.9 8.2 14.9 7 16.5 7H20M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5"/></symbol>
  <symbol id="i-seed" viewBox="0 0 24 24"><path d="M12 20v-7M12 13c0-4 3-6.5 7-6.5 0 4-3 6.5-7 6.5ZM12 13C12 9.5 9.5 7 6 7c0 3.5 2.5 6 6 6Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<div class="shell">
  <aside class="panel" aria-label="Pattern controls">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M5 0C6.1 0 7 .9 7 2v3a1 1 0 0 0 2 0V2c0-1.1.9-2 2-2h3c1.1 0 2 .9 2 2v3c0 1.1-.9 2-2 2h-3a1 1 0 0 0 0 2h3c1.1 0 2 .9 2 2v3c0 1.1-.9 2-2 2h-3c-1.1 0-2-.9-2-2v-3a1 1 0 0 0-2 0v3c0 1.1-.9 2-2 2H2c-1.1 0-2-.9-2-2v-3c0-1.1.9-2 2-2h3a1 1 0 0 0 0-2H2C.9 7 0 6.1 0 5V2C0 .9.9 0 2 0h3Z" fill="currentColor"/></svg></div>
      <div><b>ASCII pattern generator</b><span>Grid-based glyph textures</span></div>
    </div>

    <div class="scroll">
      <div class="group">
        <span class="title">Glyphs</span>
        <div class="swatches" id="glyphSwatches"></div>
        <details class="custom">
          <summary><svg class="i"><use href="#i-plus"/></svg>Custom SVG<svg class="i chev"><use href="#i-chev"/></svg></summary>
          <textarea id="customSvg" aria-label="Custom SVG markup" placeholder="&lt;svg viewBox='0 0 24 24'&gt;&lt;path d='...'/&gt;&lt;/svg&gt;"></textarea>
          <div class="hint">Paste one or more full &lt;svg&gt; tags. Use <code>currentColor</code> or leave unstyled to inherit the ink colour.</div>
        </details>
      </div>

      <div class="group">
        <span class="title">Layout</span>
        <div class="ctl">
          <div class="ctl-head"><label for="cell">Cell size</label><input type="number" class="val" id="cellV" aria-label="Cell size value"></div>
          <input type="range" id="cell" min="6" max="80" value="14">
        </div>
        <div class="ctl">
          <div class="ctl-head"><label for="scale">Icon scale</label><input type="number" class="val" id="scaleV" aria-label="Icon scale value"></div>
          <input type="range" id="scale" min="20" max="100" value="72">
        </div>
        <div class="ctl">
          <div class="ctl-head"><label for="jitter">Size jitter</label><input type="number" class="val" id="jitterV" aria-label="Size jitter value"></div>
          <input type="range" id="jitter" min="0" max="100" value="0">
        </div>
      </div>

      <div class="group">
        <span class="title">Density</span>
        <div class="ctl">
          <div class="ctl-head"><label for="density">Fill</label><input type="number" class="val" id="densityV" aria-label="Fill value"></div>
          <input type="range" id="density" min="0" max="100" value="55">
        </div>
        <div class="ctl" id="clusterRow">
          <div class="ctl-head"><label for="clusterScale">Cluster scale</label><input type="number" class="val" id="clusterScaleV" aria-label="Cluster scale value"></div>
          <input type="range" id="clusterScale" min="1" max="30" value="9">
        </div>
        <div class="ctl" id="blockRow">
          <div class="ctl-head"><label for="block">Block size</label><input type="number" class="val" id="blockV" aria-label="Block size value"></div>
          <input type="range" id="block" min="2" max="16" value="8">
        </div>
        <div class="ctl" id="solidRow">
          <div class="ctl-head"><label for="solid">Solid blocks</label><input type="number" class="val" id="solidV" aria-label="Solid blocks value"></div>
          <input type="range" id="solid" min="0" max="100" value="10">
        </div>
        <div class="ctl" id="mixRow">
          <div class="ctl-head"><label for="mix">Icon mix</label><input type="number" class="val" id="mixV" aria-label="Icon mix value"></div>
          <input type="range" id="mix" min="0" max="100" value="60">
        </div>
        <div class="ctl" id="cutRow">
          <div class="ctl-head"><label for="cut">Cutouts</label><input type="number" class="val" id="cutV" aria-label="Cutouts value"></div>
          <input type="range" id="cut" min="0" max="100" value="30">
        </div>
      </div>

      <div class="group">
        <span class="title">Canvas</span>
        <div class="ctl">
          <div class="ctl-head"><label for="cw">Width</label><input type="number" class="val" id="cwV" aria-label="Width value"></div>
          <input type="range" id="cw" min="300" max="1600" value="720" step="20">
        </div>
        <div class="ctl">
          <div class="ctl-head"><label for="ch">Height</label><input type="number" class="val" id="chV" aria-label="Height value"></div>
          <input type="range" id="ch" min="300" max="1600" value="720" step="20">
        </div>
      </div>

      <div class="group">
        <span class="title">Colour</span>
        <div class="colours">
          <label class="colour"><input type="color" id="fg" value="#c6f732"><span class="lbl">Ink</span><code id="fgHex">#c6f732</code></label>
          <label class="colour" id="groundCc"><input type="color" id="bgc" value="#000000"><span class="lbl">Ground</span><code id="bgHex">#000000</code></label>
          <label class="toggle">Transparent ground<input type="checkbox" id="transparent"><span class="sw" aria-hidden="true"></span></label>
        </div>
        <div class="hint">Exports carry no background layer, so the SVG drops straight into Figma.</div>
      </div>
    </div>

    <div class="seed-card">
      <div class="ctl">
        <div class="ctl-head"><label for="seed"><svg class="i"><use href="#i-seed"/></svg>Seed</label><input type="number" class="val" id="seedV" aria-label="Seed value"></div>
        <input type="range" id="seed" min="1" max="9999" value="42">
      </div>
      <button class="btn primary block" id="shuffle"><svg class="i"><use href="#i-shuffle"/></svg>Shuffle</button>
    </div>
  </aside>

  <main class="card">
    <div class="crumbs">
      <button class="icon-btn" id="togglePanel" aria-label="Toggle controls panel" aria-expanded="true"><svg class="i"><use href="#i-panel"/></svg></button>
      <div class="actions">
        <button class="btn" id="copySvg" title="Copy SVG"><svg class="i"><use href="#i-copy"/></svg><span>Copy SVG</span></button>
        <button class="btn" id="dlSvg" title="Download SVG"><svg class="i"><use href="#i-down"/></svg><span>SVG</span></button>
        <button class="btn" id="dlPng" title="Download PNG"><svg class="i"><use href="#i-down"/></svg><span>PNG</span></button>
      </div>
    </div>

    <div class="titlebar">
      <h2 id="dims">720 × 720<small>px</small></h2>
      <div class="chips" id="distMode" role="group" aria-label="Distribution">
        <button class="chip" data-mode="uniform"><svg class="tick"><use href="#i-tick"/></svg>Uniform</button>
        <button class="chip" data-mode="clustered"><svg class="tick"><use href="#i-tick"/></svg>Clustered</button>
        <button class="chip on" data-mode="blocky"><svg class="tick"><use href="#i-tick"/></svg>Blocky</button>
      </div>
    </div>

    <div class="stage">
      <div class="canvas-wrap" id="wrap"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------------------------------------------------------
   Glyph library. Each entry carries its own viewBox and
   normalised inner SVG markup using fill = currentColor.
----------------------------------------------------------------*/
const LIB = {
  dot:      {vb:"0 0 16 16", inner:`<circle cx="8" cy="8" r="2.4" fill="currentColor"/>`},
  circle:   {vb:"0 0 16 16", inner:`<path d="M8 0C12.4183 0 16 3.58172 16 8C16 12.4183 12.4183 16 8 16C3.58172 16 0 12.4183 0 8C0 3.58172 3.58172 0 8 0ZM8 2C4.68629 2 2 4.68629 2 8C2 11.3137 4.68629 14 8 14C11.3137 14 14 11.3137 14 8C14 4.68629 11.3137 2 8 2ZM8 4C10.2091 4 12 5.79086 12 8C12 10.2091 10.2091 12 8 12C5.79086 12 4 10.2091 4 8C4 5.79086 5.79086 4 8 4ZM8 6C6.89543 6 6 6.89543 6 8C6 9.10457 6.89543 10 8 10C9.10457 10 10 9.10457 10 8C10 6.89543 9.10457 6 8 6Z" fill="currentColor"/>`},
  circle2:  {vb:"0 0 16 16", inner:`<path d="M8 0C12.4183 0 16 3.58172 16 8C16 12.4183 12.4183 16 8 16C3.58172 16 0 12.4183 0 8C0 3.58172 3.58172 0 8 0ZM8 2C4.68629 2 2 4.68629 2 8C2 11.3137 4.68629 14 8 14C11.3137 14 14 11.3137 14 8C14 4.68629 11.3137 2 8 2ZM8 4C10.2091 4 12 5.79086 12 8C12 10.2091 10.2091 12 8 12C5.79086 12 4 10.2091 4 8C4 5.79086 5.79086 4 8 4Z" fill="currentColor"/>`},
  circle3:  {vb:"0 0 16 16", inner:`<path d="M14 0C15.1046 0 16 0.895431 16 2V14C16 15.1046 15.1046 16 14 16H2C0.895431 16 0 15.1046 0 14V2C0 0.895431 0.895431 0 2 0H14ZM8 3C5.23858 3 3 5.23858 3 8C3 10.7614 5.23858 13 8 13C10.7614 13 13 10.7614 13 8C13 5.23858 10.7614 3 8 3Z" fill="currentColor"/>`},
  cross1:   {vb:"0 0 16 16", inner:`<path d="M5 0C6.10457 0 7 0.895431 7 2V5C7 5.55228 7.44772 6 8 6C8.55228 6 9 5.55228 9 5V2C9 0.895431 9.89543 4.83192e-08 11 0H14C15.1046 0 16 0.895431 16 2V5C16 6.10457 15.1046 7 14 7H11C10.4477 7 10 7.44772 10 8C10 8.55228 10.4477 9 11 9H14C15.1046 9 16 9.89543 16 11V14C16 15.1046 15.1046 16 14 16H11C9.89543 16 9 15.1046 9 14V11C9 10.4477 8.55228 10 8 10C7.44772 10 7 10.4477 7 11V14C7 15.1046 6.10457 16 5 16H2C0.895431 16 4.83199e-08 15.1046 0 14V11C0 9.89543 0.895431 9 2 9H5C5.55228 9 6 8.55228 6 8C6 7.44772 5.55228 7 5 7H2C0.895431 7 4.83199e-08 6.10457 0 5V2C0 0.895431 0.895431 4.83192e-08 2 0H5Z" fill="currentColor"/>`},
  cross2:   {vb:"0 0 16 16", inner:`<path d="M12.5799 0.605242C13.3609 -0.175655 14.627 -0.175756 15.408 0.605242C16.1888 1.38625 16.1888 2.65236 15.408 3.43337L10.8318 8.00954L15.4099 12.5877C16.1905 13.3687 16.1907 14.6349 15.4099 15.4158C14.6289 16.1968 13.3619 16.1968 12.5808 15.4158L8.0027 10.8377L3.42555 15.4158C2.64454 16.1966 1.37844 16.1966 0.597429 15.4158C-0.183569 14.6348 -0.183467 13.3687 0.597429 12.5877L5.17458 8.00954L0.599382 3.43337C-0.181667 2.65232 -0.181667 1.38629 0.599382 0.605242C1.38044 -0.175655 2.64651 -0.175756 3.42751 0.605242L8.00368 5.18141L12.5799 0.605242Z" fill="currentColor"/>`},
  cross3:   {vb:"0 0 16 16", inner:`<path d="M10.4775 6.23242L8.70996 8L10.4775 9.76758L9.77051 10.4746L8.00293 8.70703L6.23535 10.4756L5.52832 9.76758L7.29492 8L5.52734 6.23242L6.23535 5.52539L8.00293 7.29297L9.77051 5.52539L10.4775 6.23242Z" fill="currentColor"/>`},
  plus:     {vb:"0 0 16 16", inner:`<path d="M8.5 7.5H11V8.5H8.5V11H7.5V8.5H5V7.5H7.5V5H8.5V7.5Z" fill="currentColor"/>`},
  corners:  {vb:"0 0 16 16", inner:`<path d="M2 16H0V14H2V16Z" fill="currentColor"/><path d="M16 16H14V14H16V16Z" fill="currentColor"/><path d="M2 2H0V0H2V2Z" fill="currentColor"/><path d="M16 2H14V0H16V2Z" fill="currentColor"/>`},
  diagonal: {vb:"0 0 16 16", inner:`<path d="M11.3555 10.6465L10.6484 11.3535L4.64844 5.35352L5.35547 4.64648L11.3555 10.6465Z" fill="currentColor"/>`},
};
const DEFAULT_ON = Object.keys(LIB);

/* ---------------- Seeded RNG + value noise ------------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeNoise(seed){
  // hashed value noise with smooth interpolation
  const rand = mulberry32(seed);
  const perm = new Float32Array(256*256).map(()=>rand());
  const at=(x,y)=>perm[((x&255)*256+(y&255))];
  const sm=t=>t*t*(3-2*t);
  return (x,y)=>{
    const xi=Math.floor(x), yi=Math.floor(y);
    const xf=x-xi, yf=y-yi;
    const a=at(xi,yi), b=at(xi+1,yi), c=at(xi,yi+1), d=at(xi+1,yi+1);
    const u=sm(xf), v=sm(yf);
    return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
  };
}

/* -------------------------- State ---------------------------- */
const S = {
  active: new Set(DEFAULT_ON),
  custom: [],           // array of inner-markup strings + viewBox
  cell: 14, scale: 72, jitter: 0,
  density: 55, mode: "blocky", clusterScale: 9,
  block: 8, solid: 10, mix: 60, cut: 30,
  cw: 720, ch: 720,
  fg: "#c6f732", bg: "#000000", transparent: false,
  seed: 42,
};

/* ----------------------- Glyph swatches ---------------------- */
const swatchEl = document.getElementById("glyphSwatches");
function renderSwatches(){
  swatchEl.innerHTML = "";
  Object.keys(LIB).forEach(key=>{
    const b=document.createElement("button");
    b.className="glyph-btn"+(S.active.has(key)?" on":"");
    b.setAttribute("aria-label", key); b.setAttribute("aria-pressed", String(S.active.has(key)));
    b.innerHTML=`<svg viewBox="${LIB[key].vb}">${LIB[key].inner}</svg>`;
    b.onclick=()=>{ S.active.has(key)?S.active.delete(key):S.active.add(key); renderSwatches(); render(); };
    swatchEl.appendChild(b);
  });
}

/* ------------------ Collect active glyph set ----------------- */
function glyphSet(){
  const set = [...S.active].map(k=>LIB[k]);
  S.custom.forEach(c=>set.push(c));
  return set.length?set:[LIB.dot];
}

/* ---------------- Parse custom SVG textarea ------------------ */
function parseCustom(text){
  const out=[]; if(!text.trim()) return out;
  const doc=new DOMParser().parseFromString(`<root xmlns="http://www.w3.org/2000/svg">${text}</root>`,"image/svg+xml");
  doc.querySelectorAll("svg").forEach(svg=>{
    const vb=svg.getAttribute("viewBox")||`0 0 ${svg.getAttribute("width")||24} ${svg.getAttribute("height")||24}`;
    out.push({vb, inner: svg.innerHTML});
  });
  return out;
}

/* --------------------- Build the SVG ------------------------- */
function buildSvg(){
  const {cw,ch,cell,fg,bg,seed}=S;
  const cols=Math.ceil(cw/cell), rows=Math.ceil(ch/cell);
  const rand=mulberry32(seed*7919+1);
  const noise=makeNoise(seed);
  const set=glyphSet();
  const nf=1/S.clusterScale;      // noise frequency
  const dens=S.density/100;

  /* ---- Blocky mode: precompute per-block info + solid slabs ---- */
  let blockInfo=null, bcols=0, solids="";
  const B=S.block;
  if(S.mode==="blocky"){
    bcols=Math.ceil(cols/B);
    const brows=Math.ceil(rows/B);
    const bf=0.42;                 // block-field frequency: neighbouring blocks correlate
    blockInfo=[];
    for(let br=0;br<brows;br++){
      for(let bc=0;bc<bcols;bc++){
        const brand=mulberry32(seed*31 + br*7919 + bc*104729 + 5);
        const v=noise(bc*bf, br*bf) + (dens-0.5)*1.4;   // shift field by density
        // quantised levels: 0 empty, 1 sparse dots, 2 dense icons, 3 solid slab
        let level;
        if(v<0.35) level=0;
        else if(v<0.58) level=1;
        else level=2;
        if(level===2 && brand()<S.solid/100) level=3;
        // per-block glyph palette: size and dominance driven by the Icon mix slider
        // mix 0 -> single-glyph runs; mix 100 -> up to 5 distinct glyphs, near-even picks
        const mix=S.mix/100;
        const want=Math.max(1, Math.min(set.length, 1+Math.round(mix*4)));
        const palette=[];
        for(let t=0; palette.length<want && t<want*4; t++){
          const g=set[Math.floor(brand()*set.length)];
          if(!palette.includes(g)) palette.push(g);
        }
        const dominance=0.85-0.55*mix;
        // per-block size variant: most blocks full-scale, some fine-dot scale
        const sizeMul = level===1 ? 0.4 : (brand()<0.3 ? 0.55 : 1);
        blockInfo.push({level, palette, sizeMul, dominance});
        if(level===3){
          const x=bc*B*cell, y=br*B*cell;
          const w=Math.min(B*cell, cw-x), h=Math.min(B*cell, ch-y);
          solids+=`<rect x="${x}" y="${y}" width="${w.toFixed(2)}" height="${h.toFixed(2)}"/>`;
        }
      }
    }
  }

  let cells="";
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      let g, sizeMul=1;
      if(S.mode==="blocky"){
        const bi=blockInfo[Math.floor(r/B)*bcols+Math.floor(c/B)];
        if(bi.level===0||bi.level===3) continue;          // empty, or slab already drawn
        const p = bi.level===1 ? 0.45 : 0.95;             // sparse vs dense fill rate
        if(rand()>=p) continue;
        // organic cutouts: a smooth offset noise field carves blobby voids
        // across block boundaries, like the Clustered mode's negative space
        if(S.cut>0){
          const m=noise(c*0.11+53.17, r*0.11+91.3);
          if(m < (S.cut/100)*0.55) continue;
        }
        // dominant-glyph runs, loosened by Icon mix
        g = (bi.palette.length===1||rand()<bi.dominance) ? bi.palette[0]
          : bi.palette[1+Math.floor(rand()*(bi.palette.length-1))];
        sizeMul=bi.sizeMul;
      } else if(S.mode==="clustered"){
        const n=noise(c*nf, r*nf);          // 0..1 organic field
        // remap so density slider shifts how much of the field passes
        if(n + (dens-0.5)*1.2 <= 0.5) continue;
        g=set[Math.floor(rand()*set.length)];
      } else {
        if(rand() >= dens) continue;        // uniform
        g=set[Math.floor(rand()*set.length)];
      }

      const baseSize=cell*(S.scale/100)*sizeMul;
      const jit=1 - (S.jitter/100)*rand();   // shrink up to jitter%
      const size=baseSize*jit;
      const x=c*cell+(cell-size)/2;
      const y=r*cell+(cell-size)/2;
      cells+=`<svg x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${size.toFixed(2)}" height="${size.toFixed(2)}" viewBox="${g.vb}">${g.inner}</svg>`;
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${cw}" height="${ch}" viewBox="0 0 ${cw} ${ch}">`
    + (S.transparent ? "" : `<rect width="${cw}" height="${ch}" fill="${bg}"/>`)
    + `<g fill="${fg}" color="${fg}">${solids}${cells}</g></svg>`;
}

/* --------------------------- Render -------------------------- */
const wrap=document.getElementById("wrap");
let currentSvg="";
const ranges=[...document.querySelectorAll("input[type=range]")];
function render(){
  currentSvg=buildSvg();
  wrap.innerHTML=currentSvg;
  wrap.classList.toggle("transparent", S.transparent);
  wrap.style.setProperty("--ar", S.cw/S.ch);
  // slider fills follow their values
  ranges.forEach(r=>r.style.setProperty("--p", ((r.value-r.min)/(r.max-r.min)*100)+"%"));
  document.getElementById("dims").innerHTML=`${S.cw} × ${S.ch}<small>px</small>`;
}

/* --------------------- Control wiring ------------------------ */
function bindRange(id, key){
  const el=document.getElementById(id), out=document.getElementById(id+"V");
  out.min=el.min; out.max=el.max; out.step=el.step||"1";
  const clamp=v=>Math.min(+el.max, Math.max(+el.min, v));
  const apply=v=>{ S[key]=v; render(); };
  el.addEventListener("input",()=>{ out.value=el.value; apply(+el.value); });
  // typing: apply live when the number is valid, without fighting the caret
  out.addEventListener("input",()=>{
    const v=parseFloat(out.value);
    if(isNaN(v)) return;
    const c=clamp(v); el.value=c; apply(c);
  });
  // blur/Enter: snap the field itself to the clamped value
  out.addEventListener("change",()=>{
    const v=parseFloat(out.value);
    const c=isNaN(v) ? +el.value : clamp(v);
    out.value=c; el.value=c; apply(c);
  });
  out.value=el.value; apply(+el.value);
}
bindRange("cell","cell");
bindRange("scale","scale");
bindRange("jitter","jitter");
bindRange("density","density");
bindRange("clusterScale","clusterScale");
bindRange("block","block");
bindRange("solid","solid");
bindRange("mix","mix");
bindRange("cut","cut");
bindRange("cw","cw");
bindRange("ch","ch");
bindRange("seed","seed");

document.getElementById("fg").addEventListener("input",e=>{S.fg=e.target.value;document.getElementById("fgHex").textContent=S.fg;render();});
document.getElementById("bgc").addEventListener("input",e=>{S.bg=e.target.value;document.getElementById("bgHex").textContent=S.bg;render();});

const toggleBtn=document.getElementById("togglePanel");
toggleBtn.onclick=()=>{
  const collapsed=document.body.classList.toggle("collapsed");
  toggleBtn.setAttribute("aria-expanded", String(!collapsed));
};
document.getElementById("transparent").addEventListener("change",e=>{
  S.transparent=e.target.checked;
  document.getElementById("groundCc").classList.toggle("off", S.transparent);
  render();
});

function updateModeRows(){
  document.getElementById("clusterRow").style.display = S.mode==="clustered" ? "" : "none";
  document.getElementById("blockRow").style.display   = S.mode==="blocky" ? "" : "none";
  document.getElementById("solidRow").style.display   = S.mode==="blocky" ? "" : "none";
  document.getElementById("mixRow").style.display     = S.mode==="blocky" ? "" : "none";
  document.getElementById("cutRow").style.display     = S.mode==="blocky" ? "" : "none";
}
document.querySelectorAll("#distMode button").forEach(b=>{
  b.setAttribute("aria-pressed", String(b.classList.contains("on")));
  b.onclick=()=>{
    document.querySelectorAll("#distMode button").forEach(x=>{x.classList.remove("on");x.setAttribute("aria-pressed","false");});
    b.classList.add("on"); b.setAttribute("aria-pressed","true"); S.mode=b.dataset.mode;
    updateModeRows();
    render();
  };
});
updateModeRows();

document.getElementById("customSvg").addEventListener("input",e=>{
  S.custom=parseCustom(e.target.value); render();
});

document.getElementById("shuffle").onclick=()=>{
  const s=Math.floor(Math.random()*9999)+1;
  S.seed=s; const el=document.getElementById("seed"); el.value=s;
  document.getElementById("seedV").value=s; render();
};

/* --------------------------- Export -------------------------- */
const toast=document.getElementById("toast");
function flash(msg){toast.textContent=msg;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1400);}

document.getElementById("copySvg").onclick=async()=>{
  try{ await navigator.clipboard.writeText(currentSvg); flash("SVG copied"); }
  catch{ flash("Copy failed"); }
};
function download(name, blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("dlSvg").onclick=()=>{
  download("pattern.svg", new Blob([currentSvg],{type:"image/svg+xml"})); flash("SVG downloaded");
};
document.getElementById("dlPng").onclick=()=>{
  const scale=2;
  const img=new Image();
  const blob=new Blob([currentSvg],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob);
  img.onload=()=>{
    const cv=document.createElement("canvas");
    cv.width=S.cw*scale; cv.height=S.ch*scale;
    const ctx=cv.getContext("2d"); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
    cv.toBlob(b=>{ download("pattern.png", b); flash("PNG downloaded"); URL.revokeObjectURL(url); });
  };
  img.src=url;
};

/* --------------------------- Init ---------------------------- */
renderSwatches();
render();
</script>
